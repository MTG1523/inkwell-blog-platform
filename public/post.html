<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post — Inkwell</title>
  <meta name="description" content="Read this post on Inkwell." />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="page-loader"><div class="loader-spinner"></div></div>

  <header class="navbar" id="navbar"></header>

  <main class="page">
    <div class="post-view container" id="post-view">
      <!-- Content injected by JS -->
      <div class="card skeleton-card" style="margin-bottom:20px">
        <div class="sk-line skeleton sk-title" style="width:80%;height:28px;margin-bottom:20px"></div>
        <div class="sk-line skeleton" style="height:10px;width:40%;margin-bottom:30px"></div>
        <div class="sk-line skeleton sk-text"></div>
        <div class="sk-line skeleton sk-text"></div>
        <div class="sk-line skeleton sk-text" style="width:70%"></div>
      </div>
    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script>
    renderNavbar('');

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    const params = new URLSearchParams(window.location.search);
    const postId = params.get('id');

    if (!postId) {
      document.getElementById('post-view').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🔍</div>
          <div class="empty-title">Post not found</div>
          <a href="/" class="btn btn-primary">Back to Home</a>
        </div>`;
      hideLoader();
    } else {
      loadPost();
    }

    async function loadPost() {
      try {
        const [post, comments] = await Promise.all([
          api.getPost(postId),
          api.getComments(postId)
        ]);

        // Update page meta
        document.title = post.title + ' — Inkwell';

        const currentUser = Auth.getUser();
        const isAuthor = currentUser && currentUser.id === post.author_id;

        const container = document.getElementById('post-view');
        container.innerHTML = `
          <a href="/" class="back-link">← Back to feed</a>

          <article>
            <header class="post-hero">
              <h1>${escHtml(post.title)}</h1>
              <div class="post-meta-bar">
                ${makeAvatar(post.username, post.avatar_color, 36)}
                <div>
                  <div style="font-weight:600;font-size:0.9rem">${escHtml(post.username)}</div>
                  <div style="font-size:0.78rem;color:var(--text-muted)">${timeAgo(post.created_at)}${post.updated_at !== post.created_at ? ' · Updated ' + timeAgo(post.updated_at) : ''}</div>
                </div>
                <span class="read-badge">📖 ${post.read_time} min read</span>
              </div>
              ${isAuthor ? `
                <div class="post-actions">
                  <a href="/editor.html?edit=${post.id}" class="btn btn-ghost btn-sm">✏ Edit</a>
                  <button class="btn btn-danger btn-sm" onclick="deletePost(${post.id})">🗑 Delete</button>
                </div>
              ` : ''}
            </header>

            <hr class="divider" />

            <div class="post-content" id="post-body">
              ${marked.parse(post.content, { breaks: true, gfm: true })}
            </div>
          </article>

          <hr class="divider" />

          <section class="comments-section" id="comments-section">
            <h2 class="comments-title">
              Comments
              <span class="comment-count" id="comment-count">${comments.length}</span>
            </h2>

            ${Auth.isLoggedIn() ? `
              <div class="card comment-form">
                <div style="display:flex;gap:12px;align-items:flex-start">
                  ${makeAvatar(currentUser.username, currentUser.avatarColor, 34)}
                  <div style="flex:1">
                    <textarea id="comment-input" placeholder="Share your thoughts..." maxlength="2000"></textarea>
                    <div class="form-actions">
                      <button class="btn btn-primary btn-sm" id="comment-submit-btn" onclick="submitComment(${post.id})">Post Comment</button>
                    </div>
                  </div>
                </div>
              </div>
            ` : `
              <div class="card" style="padding:20px;text-align:center;margin-bottom:24px">
                <p style="color:var(--text-muted);margin-bottom:12px">Sign in to join the conversation</p>
                <a href="/auth.html?next=${encodeURIComponent(window.location.pathname + window.location.search)}" class="btn btn-primary btn-sm">Sign In to Comment</a>
              </div>
            `}

            <div id="comments-list">
              ${renderComments(comments, currentUser)}
            </div>
          </section>
        `;
      } catch (err) {
        document.getElementById('post-view').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">⚠️</div>
            <div class="empty-title">Couldn't load post</div>
            <div class="empty-sub">${err.message}</div>
            <a href="/" class="btn btn-primary">Back to Home</a>
          </div>`;
      }
      hideLoader();
    }

    function renderComments(comments, currentUser) {
      if (comments.length === 0) {
        return `<div class="empty-state" style="padding:40px 0">
          <div class="empty-icon">💬</div>
          <div class="empty-title">No comments yet</div>
          <div class="empty-sub">Be the first to share your thoughts!</div>
        </div>`;
      }
      return comments.map(c => `
        <div class="card comment-item" id="comment-${c.id}">
          <div class="comment-meta">
            ${makeAvatar(c.username, c.avatar_color, 30)}
            <span class="comment-author">${escHtml(c.username)}</span>
            <span class="comment-time">${timeAgo(c.created_at)}</span>
            ${currentUser && currentUser.id === c.author_id
              ? `<button class="btn btn-danger btn-sm comment-delete" onclick="deleteComment(${c.id})">✕</button>`
              : ''}
          </div>
          <div class="comment-content">${escHtml(c.content)}</div>
        </div>
      `).join('');
    }

    async function submitComment(postId) {
      const input = document.getElementById('comment-input');
      const btn = document.getElementById('comment-submit-btn');
      const content = input.value.trim();
      if (!content) return;

      btn.textContent = 'Posting...';
      btn.disabled = true;

      try {
        const comment = await api.addComment(postId, { content });
        const currentUser = Auth.getUser();
        const list = document.getElementById('comments-list');

        // Remove empty state if present
        const emptyState = list.querySelector('.empty-state');
        if (emptyState) emptyState.remove();

        // Prepend new comment
        const div = document.createElement('div');
        div.innerHTML = `
          <div class="card comment-item" id="comment-${comment.id}" style="animation:toast-in 0.3s ease">
            <div class="comment-meta">
              ${makeAvatar(comment.username, comment.avatar_color, 30)}
              <span class="comment-author">${escHtml(comment.username)}</span>
              <span class="comment-time">just now</span>
              <button class="btn btn-danger btn-sm comment-delete" onclick="deleteComment(${comment.id})">✕</button>
            </div>
            <div class="comment-content">${escHtml(comment.content)}</div>
          </div>`;
        list.insertBefore(div.firstElementChild, list.firstChild);

        // Update count
        const countEl = document.getElementById('comment-count');
        if (countEl) countEl.textContent = parseInt(countEl.textContent || 0) + 1;

        input.value = '';
        showToast('Comment posted!', 'success');
      } catch (err) {
        showToast(err.message, 'error');
      }

      btn.textContent = 'Post Comment';
      btn.disabled = false;
    }

    async function deleteComment(id) {
      if (!confirm('Delete this comment?')) return;
      try {
        await api.deleteComment(id);
        const el = document.getElementById('comment-' + id);
        if (el) { el.style.opacity = '0'; setTimeout(() => el.remove(), 250); }
        const countEl = document.getElementById('comment-count');
        if (countEl) countEl.textContent = Math.max(0, parseInt(countEl.textContent) - 1);
        showToast('Comment deleted', 'info');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function deletePost(id) {
      if (!confirm('Are you sure you want to delete this post? This cannot be undone.')) return;
      try {
        await api.deletePost(id);
        showToast('Post deleted', 'info');
        setTimeout(() => window.location.href = '/', 700);
      } catch (err) {
        showToast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
