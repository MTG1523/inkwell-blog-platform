<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inkwell — Sign In</title>
  <meta name="description" content="Sign in or create an account on Inkwell to start writing and engaging with the community." />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="page-loader"><div class="loader-spinner"></div></div>

  <header class="navbar" id="navbar"></header>

  <main class="auth-page">
    <div class="card auth-card">
      <div class="auth-logo">
        <div class="logo-icon">✦</div>
        <h2>Welcome to <span style="background:linear-gradient(90deg,#a78bfa,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Inkwell</span></h2>
        <p style="color:var(--text-muted);font-size:0.85rem;margin-top:6px">Your ideas deserve an audience</p>
      </div>

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab" id="tab-login" onclick="switchTab('login')">Sign In</button>
        <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Create Account</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="login-email">Email</label>
          <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <div id="login-error" class="form-error hidden"></div>
        <button type="submit" id="login-btn" class="btn btn-primary w-full mt-2" style="justify-content:center">Sign In</button>
      </form>

      <!-- Register Form -->
      <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label" for="reg-username">Username</label>
          <input type="text" id="reg-username" class="form-input" placeholder="coolwriter42" required autocomplete="username" minlength="3" />
          <div class="form-hint">At least 3 characters, letters and numbers only</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-email">Email</label>
          <input type="email" id="reg-email" class="form-input" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <input type="password" id="reg-password" class="form-input" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password" />
        </div>
        <div id="reg-error" class="form-error hidden"></div>
        <button type="submit" id="reg-btn" class="btn btn-primary w-full mt-2" style="justify-content:center">Create Account</button>
      </form>
    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script>
    // Redirect if already logged in
    if (Auth.isLoggedIn()) window.location.href = '/';

    renderNavbar('');
    hideLoader();

    // Determine initial tab
    const params = new URLSearchParams(window.location.search);
    const initialTab = params.get('tab') === 'register' ? 'register' : 'login';
    switchTab(initialTab);

    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('tab-login').classList.toggle('active', isLogin);
      document.getElementById('tab-register').classList.toggle('active', !isLogin);
      document.getElementById('login-form').classList.toggle('hidden', !isLogin);
      document.getElementById('register-form').classList.toggle('hidden', isLogin);
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('login-error');
      errEl.classList.add('hidden');
      btn.textContent = 'Signing in...';
      btn.disabled = true;

      try {
        const { token, user } = await api.login({
          email: document.getElementById('login-email').value,
          password: document.getElementById('login-password').value,
        });
        Auth.save(token, user);
        showToast('Welcome back, ' + user.username + '! 🎉', 'success');
        const next = params.get('next') || '/';
        setTimeout(() => window.location.href = next, 600);
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
        btn.textContent = 'Sign In';
        btn.disabled = false;
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('reg-btn');
      const errEl = document.getElementById('reg-error');
      errEl.classList.add('hidden');
      btn.textContent = 'Creating account...';
      btn.disabled = true;

      try {
        const { token, user } = await api.register({
          username: document.getElementById('reg-username').value,
          email: document.getElementById('reg-email').value,
          password: document.getElementById('reg-password').value,
        });
        Auth.save(token, user);
        showToast('Account created! Welcome, ' + user.username + ' 🎉', 'success');
        setTimeout(() => window.location.href = '/editor.html', 700);
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
        btn.textContent = 'Create Account';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
